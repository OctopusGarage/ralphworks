name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:local
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$NOTES"
          TITLE="RalphWorks $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$NOTES"
            gh release upload "$GITHUB_REF_NAME" "/tmp/ralphworks-$VERSION.tgz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "/tmp/ralphworks-$VERSION.tgz" --title "$TITLE" --notes-file "$NOTES" --verify-tag
          fi
